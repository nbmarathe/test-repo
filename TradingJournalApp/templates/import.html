{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-xl p-6">
  <h2 class="text-2xl font-semibold mb-4">Import Tradebook</h2>
  <p class="text-slate-400 mb-6">Upload only <code class="bg-slate-800 px-2 py-1 rounded">tradebook-OI8327-EQ.csv</code>.</p>
  <form action="/import" method="post" enctype="multipart/form-data" class="space-y-4">
    <input type="file" name="tradebook" required class="block w-full text-sm text-slate-300" />
    <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded">Process File</button>
  </form>
  {% if message %}
    <div class="mt-4 p-3 rounded {% if message == 'Invalid File' %}bg-red-900/40 text-red-300{% else %}bg-emerald-900/40 text-emerald-300{% endif %}">
      {{ message }}
    </div>
  {% endif %}
</div>
{% endblock %}
